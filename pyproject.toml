[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvos-lab"
version = "0.1.0"
description = "Unified Memory & KV Residency Observatory for Apple Silicon (MLX / Metal)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx>=0.20", "numpy>=1.24"]

[project.scripts]
kvos = "kvos.cli:main"

[tool.setuptools.packages.find]
include = ["kvos*"]
